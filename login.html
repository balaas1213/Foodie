<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login | Foodie</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍔</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/auth.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<header class="navbar">
  <div class="container navbar__inner">
    <a href="index.html" class="navbar__brand">
      <span class="brand-mark"><i class="fa-solid fa-utensils"></i></span>
      FOOD<span>IE</span>
    </a>
    <nav class="navbar__menu" id="navbarMenu">
      <ul class="navbar__links">
        <li><a href="index.html">Home</a></li>
        <li><a href="restaurants.html">Restaurants</a></li>
      </ul>
    </nav>
    <div class="navbar__actions">
      <a href="cart.html" class="icon-btn" aria-label="View cart">
        <i class="fa-solid fa-bag-shopping"></i>
        <span class="cart-badge" data-cart-count>0</span>
      </a>
      <button class="navbar__toggle" aria-label="Toggle menu" aria-expanded="false">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <span class="brand-mark"><i class="fa-solid fa-utensils"></i></span>
    </div>
    <h1>Welcome back</h1>
    <p class="auth-card__sub">Login to continue ordering your favorite food.</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" class="form-control" required />
        <span class="form-error">Please enter a valid email address.</span>
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" class="form-control" required />
        <span class="form-error">Password is required.</span>
      </div>

      <div class="auth-row">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe" /> Remember me
        </label>
        <a href="#" id="forgotPasswordLink">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn--primary btn--block">Login</button>
    </form>

    <p class="auth-card__footer">Don't have an account? <a href="register.html">Create one</a></p>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
