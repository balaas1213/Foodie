<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account | Foodie</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍔</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/auth.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<header class="navbar">
  <div class="container navbar__inner">
    <a href="index.html" class="navbar__brand">
      <span class="brand-mark"><i class="fa-solid fa-utensils"></i></span>
      FOOD<span>IE</span>
    </a>
    <nav class="navbar__menu" id="navbarMenu">
      <ul class="navbar__links">
        <li><a href="index.html">Home</a></li>
        <li><a href="restaurants.html">Restaurants</a></li>
      </ul>
    </nav>
    <div class="navbar__actions">
      <a href="cart.html" class="icon-btn" aria-label="View cart">
        <i class="fa-solid fa-bag-shopping"></i>
        <span class="cart-badge" data-cart-count>0</span>
      </a>
      <button class="navbar__toggle" aria-label="Toggle menu" aria-expanded="false">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <span class="brand-mark"><i class="fa-solid fa-utensils"></i></span>
    </div>
    <h1>Create your account</h1>
    <p class="auth-card__sub">Join Foodie and start ordering in minutes.</p>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" class="form-control" required />
        <span class="form-error">Please enter your full name.</span>
      </div>

      <div class="form-group">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" class="form-control" required />
        <span class="form-error">Please enter a valid email address.</span>
      </div>

      <div class="form-group">
        <label for="regPhone">Phone Number</label>
        <input type="tel" id="regPhone" class="form-control" placeholder="10-digit mobile number" required />
        <span class="form-error">Enter a valid 10-digit phone number.</span>
      </div>

      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" class="form-control" required />
        <span class="form-error">Password must be at least 6 characters.</span>
      </div>

      <div class="form-group">
        <label for="regConfirmPassword">Confirm Password</label>
        <input type="password" id="regConfirmPassword" class="form-control" required />
        <span class="form-error">Passwords do not match.</span>
      </div>

      <button type="submit" class="btn btn--primary btn--block">Create Account</button>
    </form>

    <p class="auth-card__footer">Already have an account? <a href="login.html">Login</a></p>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
