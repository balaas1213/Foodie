<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Orders | Foodie</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍔</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/profile.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<header class="navbar">
  <div class="container navbar__inner">
    <a href="index.html" class="navbar__brand">
      <span class="brand-mark"><i class="fa-solid fa-utensils"></i></span>
      FOOD<span>IE</span>
    </a>
    <nav class="navbar__menu" id="navbarMenu">
      <ul class="navbar__links">
        <li><a href="index.html">Home</a></li>
        <li><a href="restaurants.html">Restaurants</a></li>
      </ul>
    </nav>
    <div class="navbar__actions">
      <a href="login.html" class="auth-link" data-auth-link>
        <i class="fa-solid fa-circle-user"></i><span>Login</span>
      </a>
      <a href="cart.html" class="icon-btn" aria-label="View cart">
        <i class="fa-solid fa-bag-shopping"></i>
        <span class="cart-badge" data-cart-count>0</span>
      </a>
      <button class="navbar__toggle" aria-label="Toggle menu" aria-expanded="false">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="container page-header">
    <h1>My Orders</h1>
    <p>Track and reorder from your order history.</p>
  </div>

  <div class="container orders-page">
    <div class="orders-list" id="ordersList"></div>
    <div class="empty-state" id="ordersEmptyState" style="display:none;">
      <i class="fa-solid fa-receipt"></i>
      <h3>No orders yet</h3>
      <p>All your placed orders will show up here.</p>
      <a href="restaurants.html" class="btn btn--primary">Order Now</a>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer__bottom" style="border-top:none; padding-top:0;">
      <p>&copy; <span data-year></span> Foodie. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
