<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Confirmed | Foodie</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍔</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/checkout.css" />
<link rel="stylesheet" href="css/responsive.css" />
<style>
  .success-wrap { max-width: 680px; margin: 0 auto; padding: 60px 24px 80px; }
  .success-icon {
    width: 84px; height: 84px; border-radius: 50%;
    background: var(--color-secondary-light); color: var(--color-secondary);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.4rem; margin: 0 auto 20px;
  }
  .success-heading { text-align: center; margin-bottom: 6px; font-size: 1.8rem; }
  .success-sub { text-align: center; color: var(--color-text-muted); margin-bottom: 36px; }
  .order-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 28px; margin-bottom: 24px; }
  .order-card__row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--color-border); font-size: 0.92rem; }
  .order-card__row:last-child { border-bottom: none; }
  .order-card__row span:first-child { color: var(--color-text-muted); }
  .order-card__row span:last-child { font-weight: 600; text-align: right; }

  .tracking { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 32px 28px; margin-bottom: 32px; }
  .tracking h3 { margin-bottom: 24px; }
  .tracking-steps { display: flex; justify-content: space-between; position: relative; }
  .tracking-steps::before {
    content: ""; position: absolute; top: 18px; left: 5%; right: 5%; height: 3px;
    background: var(--color-border); z-index: 0;
  }
  .tracking-steps__fill { position: absolute; top: 18px; left: 5%; height: 3px; background: var(--color-primary); z-index: 1; width: 22%; transition: width 0.4s ease; }
  .tracking-step { flex: 1; text-align: center; position: relative; z-index: 2; }
  .tracking-step__dot {
    width: 38px; height: 38px; border-radius: 50%; background: #fff; border: 3px solid var(--color-border);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; color: var(--color-border);
  }
  .tracking-step.active .tracking-step__dot { border-color: var(--color-primary); color: var(--color-primary); background: var(--color-primary-light); }
  .tracking-step span { font-size: 0.78rem; font-weight: 600; color: var(--color-text-muted); }
  .tracking-step.active span { color: var(--color-text); }

  .success-actions { display: flex; gap: 14px; }
  .success-actions .btn { flex: 1; }
</style>
</head>
<body>

<header class="navbar">
  <div class="container navbar__inner">
    <a href="index.html" class="navbar__brand">
      <span class="brand-mark"><i class="fa-solid fa-utensils"></i></span>
      FOOD<span>IE</span>
    </a>
    <nav class="navbar__menu" id="navbarMenu">
      <ul class="navbar__links">
        <li><a href="index.html">Home</a></li>
        <li><a href="restaurants.html">Restaurants</a></li>
      </ul>
    </nav>
    <div class="navbar__actions">
      <a href="login.html" class="auth-link" data-auth-link>
        <i class="fa-solid fa-circle-user"></i><span>Login</span>
      </a>
      <a href="cart.html" class="icon-btn" aria-label="View cart">
        <i class="fa-solid fa-bag-shopping"></i>
        <span class="cart-badge" data-cart-count>0</span>
      </a>
      <button class="navbar__toggle" aria-label="Toggle menu" aria-expanded="false">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="success-wrap" id="successWrap">
    <!-- Populated by orders.js's shared renderer via order-success inline script -->
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer__bottom" style="border-top:none; padding-top:0;">
      <p>&copy; <span data-year></span> Foodie. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
